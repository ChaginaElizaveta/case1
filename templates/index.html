<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аутентификация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 440px;
            max-width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input {
            width: 100%; padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px; font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        input.weak { border-color: #dc3545; }
        input.medium { border-color: #ffc107; }
        input.strong { border-color: #28a745; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        .message {
            margin-top: 15px; padding: 12px;
            border-radius: 10px; text-align: center;
            display: none; font-weight: 500; font-size: 14px;
        }
        .message.show { display: block; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .toggle-link {
            text-align: center; margin-top: 20px;
            color: #667eea; cursor: pointer;
        }
        .hidden { display: none !important; }
        .spinner {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s infinite; vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .password-strength {
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            background: #f8f9fa;
            display: none;
        }
        .password-strength.show { display: block; }
        .strength-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .strength-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background 0.3s;
            border-radius: 4px;
        }
        .strength-text {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .strength-details {
            font-size: 12px;
            color: #666;
            line-height: 1.5;
        }
        .strength-details .crack-time {
            color: #0c5460;
            background: #d1ecf1;
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 6px;
            display: block;
        }
        .strength-details .warning {
            color: #856404;
            background: #fff3cd;
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 6px;
            display: block;
        }

        #userDetails {
            text-align: center;
            font-size: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 20px 0;
            color: #333;
        }
        .security-badge {
            background: #e7f3ff; color: #0056b3;
            padding: 8px; border-radius: 8px;
            font-size: 12px; text-align: center;
            margin-bottom: 20px;
        }
    </style>

    <!-- zxcvbn на клиенте -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
</head>
<body>
    <div class="container">
        <!-- Форма регистрации -->
        <form id="registerForm" onsubmit="handleRegistration(event)">
            <h1>🔐 Регистрация</h1>

            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="regUsername" placeholder="Введите логин" required minlength="3">
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="regPassword" placeholder="Введите пароль" required minlength="8">
                <div id="passwordStrength" class="password-strength">
                    <div class="strength-bar">
                        <div id="strengthBarFill" class="strength-bar-fill"></div>
                    </div>
                    <div id="strengthText" class="strength-text"></div>
                    <div id="strengthDetails" class="strength-details"></div>
                </div>
            </div>

            <button type="submit" id="registerBtn">Зарегистрироваться</button>
            <div id="registerMessage" class="message"></div>

            <div class="toggle-link" onclick="switchToLogin()">
                Уже есть аккаунт? Войти
            </div>
        </form>

        <!-- Форма входа -->
        <form id="loginForm" class="hidden" onsubmit="handleLogin(event)">
            <h1>🔑 Вход</h1>

            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="loginUsername" placeholder="Введите логин" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль" required>
            </div>

            <button type="submit" id="loginBtn">Войти</button>
            <div id="loginMessage" class="message"></div>

            <div class="toggle-link" onclick="switchToRegister()">
                Нет аккаунта? Зарегистрироваться
            </div>
        </form>

        <!-- Профиль -->
        <div id="userInfo" class="hidden">
            <h1>👤 Добро пожаловать!</h1>
            <div id="userDetails"></div>
            <button onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        class CryptoHelper {
            static generateSalt(length = 16) {
                const array = new Uint8Array(length);
                crypto.getRandomValues(array);
                return Array.from(array)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
            }

            static async hashPassword(password, salt) {
                const encoder = new TextEncoder();
                const passwordData = encoder.encode(password);
                const saltData = encoder.encode(salt);

                const keyMaterial = await crypto.subtle.importKey(
                    'raw', passwordData, 'PBKDF2', false, ['deriveBits']
                );

                const hashBuffer = await crypto.subtle.deriveBits(
                    {
                        name: 'PBKDF2',
                        salt: saltData,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    256
                );

                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            static async preparePassword(password) {
                const salt = this.generateSalt();
                const hash = await this.hashPassword(password, salt);
                return { salt, hash };
            }
        }

        let currentUser = null;

        function switchToLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            clearMessages();
        }

        function switchToRegister() {
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
            clearMessages();
        }

        function clearMessages() {
            document.querySelectorAll('.message').forEach(el => {
                el.textContent = '';
                el.className = 'message';
            });
        }

        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = `message show ${type}`;
        }

        // ============================================
        // ИНДИКАТОР СИЛЫ ПАРОЛЯ (zxcvbn локально)
        // ============================================
        let checkPasswordTimer = null;

        document.getElementById('regPassword').addEventListener('input', function () {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            const barFill = document.getElementById('strengthBarFill');
            const strengthText = document.getElementById('strengthText');
            const strengthDetails = document.getElementById('strengthDetails');

            clearTimeout(checkPasswordTimer);

            if (!password) {
                strengthDiv.classList.remove('show');
                this.classList.remove('weak', 'medium', 'strong');
                return;
            }

            checkPasswordTimer = setTimeout(() => {
                const result = zxcvbn(password);
                const score = result.score;

                strengthDiv.classList.add('show');

                const colors = ['#dc3545', '#dc3545', '#ffc107', '#28a745', '#28a745'];
                const percents = [20, 40, 60, 80, 100];
                const labels = [
                    'Очень слабый', 'Слабый', 'Средний', 'Надежный', 'Очень надежный'
                ];

                barFill.style.width = percents[score] + '%';
                barFill.style.background = colors[score];
                strengthText.textContent = labels[score] + ` (${score}/4)`;
                strengthText.style.color = colors[score];

                let detailsHTML = '';
                if (result.crack_times_display &&
                    result.crack_times_display.offline_slow_hashing_1e4_per_second) {
                    detailsHTML += `<span class="crack-time">⏱️ Время взлома: ${
                        result.crack_times_display.offline_slow_hashing_1e4_per_second
                    }</span>`;
                }
                if (result.feedback && result.feedback.warning) {
                    detailsHTML += `<span class="warning">⚠️ ${result.feedback.warning}</span>`;
                }
                if (result.feedback && result.feedback.suggestions &&
                    result.feedback.suggestions.length > 0) {
                    detailsHTML += `<div style="margin-top: 6px;">💡 ${
                        result.feedback.suggestions.join('. ')
                    }</div>`;
                }
                strengthDetails.innerHTML = detailsHTML;

                this.classList.remove('weak', 'medium', 'strong');
                if (score <= 1) this.classList.add('weak');
                else if (score === 2) this.classList.add('medium');
                else this.classList.add('strong');
            }, 300);
        });

        // ============================================
        // РЕГИСТРАЦИЯ
        // ============================================
        async function handleRegistration(event) {
            event.preventDefault();

            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const messageDiv = document.getElementById('registerMessage');
            const btn = document.getElementById('registerBtn');

            if (!username || !password) {
                showMessage(messageDiv, 'Заполните все поля', 'error');
                return false;
            }

            if (username.length < 3) {
                showMessage(messageDiv, 'Логин минимум 3 символа', 'error');
                return false;
            }

            if (password.length < 8) {
                showMessage(messageDiv, 'Пароль минимум 8 символов', 'error');
                return false;
            }

            const strength = zxcvbn(password);
            if (strength.score < 3) {
                let msg = `⚠️ Слабый пароль (оценка ${strength.score}/4)`;
                if (strength.feedback && strength.feedback.warning) {
                    msg += '. ' + strength.feedback.warning;
                }
                showMessage(messageDiv, msg, 'error');
                return false;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Регистрация...';

                const { salt, hash } = await CryptoHelper.preparePassword(password);

                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        passwordHash: hash,
                        salt
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showMessage(messageDiv, '✅ ' + result.message, 'success');
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('passwordStrength').classList.remove('show');

                    setTimeout(() => {
                        switchToLogin();
                        showMessage(
                            document.getElementById('loginMessage'),
                            'Теперь вы можете войти',
                            'success'
                        );
                    }, 1500);
                } else {
                    showMessage(messageDiv, '❌ ' + result.message, 'error');
                }
            } catch (error) {
                showMessage(messageDiv, '❌ Ошибка соединения с сервером', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Зарегистрироваться';
            }

            return false;
        }

        // ============================================
        // ВХОД
        // ============================================
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const messageDiv = document.getElementById('loginMessage');
            const btn = document.getElementById('loginBtn');

            if (!username || !password) {
                showMessage(messageDiv, 'Заполните все поля', 'error');
                return false;
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Вход...';

                const challengeResponse = await fetch(
                    `/api/get-challenge?username=${encodeURIComponent(username)}`
                );
                const challengeData = await challengeResponse.json();

                if (!challengeData.success) {
                    showMessage(messageDiv, '❌ ' + challengeData.message, 'error');
                    return false;
                }

                const hash = await CryptoHelper.hashPassword(
                    password,
                    challengeData.salt
                );

                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        passwordHash: hash,
                        challenge: challengeData.challenge,
                        timestamp: challengeData.timestamp
                    })
                });

                const result = await response.json();

                if (result.success) {
                    currentUser = result.user;
                    showMessage(messageDiv, '✅ ' + result.message, 'success');

                    document.getElementById('userDetails').innerHTML =
                        `👋 Здравствуйте, <strong>${result.user.username}</strong>!`;

                    document.getElementById('userInfo').classList.remove('hidden');
                    document.getElementById('loginForm').classList.add('hidden');
                    document.getElementById('registerForm').classList.add('hidden');
                    document.getElementById('loginPassword').value = '';
                } else {
                    showMessage(messageDiv, '❌ ' + result.message, 'error');
                }
            } catch (error) {
                showMessage(messageDiv, '❌ Ошибка соединения с сервером', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Войти';
            }

            return false;
        }

        // ============================================
        // ВЫХОД
        // ============================================
        function logout() {
            currentUser = null;
            document.getElementById('userInfo').classList.add('hidden');
            switchToLogin();
            showMessage(document.getElementById('loginMessage'), 'Вы вышли из системы', 'info');
        }
    </script>
</body>
</html>
